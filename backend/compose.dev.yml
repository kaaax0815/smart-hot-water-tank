services:
  db:
    image: timescale/timescaledb:latest-pg17
    container_name: hotwater-db
    environment:
      PGDATA: /pgdata
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_DB: ${DB_NAME}
      TZ: Europe/Berlin
    healthcheck:
      test: pg_isready -U ${DB_USER} -d ${DB_NAME}
      interval: 10s
      timeout: 3s
      retries: 3

  hotwater:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hotwater
    depends_on:
      db:
        condition: service_healthy
        restart: true
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db:5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      TZ: Europe/Berlin
      SEED: "dev"
